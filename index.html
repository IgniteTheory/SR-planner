<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SR Planner</title>
<style>
  :root {
    --green: #1f7a4d;
    --green-dark: #175f3c;
    --green-light: #e8f5ee;
    --bg: #f4f6f5;
    --card: #ffffff;
    --border: #dde3e0;
    --text: #1e2422;
    --text-muted: #6b7570;
    --danger: #c0392b;
    --amber: #b8790f;
    --meeting: #8b5cf6;
    --meeting-bg: #f6f1ff;
    --sans: 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: var(--sans);
    background: var(--bg);
    color: var(--text);
    font-size: 14px;
  }
  header.topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--green);
    color: #fff;
    padding: 10px 20px;
  }
  header.topbar h1 {
    font-size: 18px;
    margin: 0;
    font-weight: 600;
  }
  header.topbar .date {
    font-size: 13px;
    opacity: 0.9;
  }
  header.topbar .actions { display: flex; align-items: center; gap: 10px; }
  .btn {
    border: none;
    border-radius: 5px;
    padding: 7px 14px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    font-family: var(--sans);
  }
  .btn-primary { background: var(--green); color: #fff; }
  .btn-primary:hover { background: var(--green-dark); }
  .btn-light { background: #fff; color: var(--green); border: 1px solid var(--green); }
  .btn-light:hover { background: var(--green-light); }
  .btn-secondary { background: #eef1f0; color: var(--text); }
  .btn-secondary:hover { background: #e2e6e4; }
  .btn-danger { background: none; color: var(--danger); }
  .btn-danger:hover { text-decoration: underline; }
  .btn-sm { padding: 4px 9px; font-size: 12px; border-radius: 4px; }
  .btn:disabled { opacity: 0.5; cursor: default; }

  .layout {
    display: grid;
    grid-template-columns: 250px 1fr 270px;
    gap: 14px;
    padding: 14px;
    align-items: start;
  }

  .panel {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px;
  }
  .panel h2 {
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    color: var(--text-muted);
    margin: 0 0 8px;
  }
  .panel h3 {
    font-size: 12px;
    font-weight: 700;
    color: var(--green-dark);
    margin: 14px 0 6px;
    text-transform: uppercase;
    letter-spacing: 0.03em;
  }
  .panel h3:first-of-type { margin-top: 0; }

  /* Left panel */
  .person-block { margin-bottom: 10px; }
  .person-name {
    font-weight: 700;
    font-size: 15px;
    margin-bottom: 6px;
  }
  .divider {
    border: none;
    border-top: 1px solid var(--border);
    margin: 14px 0;
  }
  .mini-list { display: flex; flex-direction: column; gap: 6px; }
  .mini-task {
    border: 1px solid var(--border);
    border-left: 4px solid var(--green);
    border-radius: 5px;
    padding: 6px 8px;
    cursor: pointer;
    background: #fff;
  }
  .mini-task:hover { background: var(--green-light); }
  .mini-task .t { font-weight: 600; font-size: 12.5px; }
  .mini-task .c { color: var(--text-muted); font-size: 11.5px; }
  .empty-note { color: var(--text-muted); font-size: 12px; padding: 4px 2px; }
  .link-note { color: var(--green-dark); font-size: 11.5px; padding: 4px 2px; cursor: pointer; }
  .link-note:hover { text-decoration: underline; }

  .phone-slip {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 4px 2px;
    border-bottom: 1px dashed var(--border);
    font-size: 12.5px;
  }
  .phone-slip.done .txt { text-decoration: line-through; color: var(--text-muted); }
  .phone-slip .txt { flex: 1; }
  .phone-slip button { border: none; background: none; cursor: pointer; color: var(--text-muted); font-size: 13px; }
  .phone-slip button:hover { color: var(--danger); }
  .phone-slip-add { display: flex; gap: 4px; margin-top: 6px; }
  .phone-slip-add input {
    flex: 1; font-size: 12.5px; padding: 5px 6px; border: 1px solid var(--border); border-radius: 4px; font-family: var(--sans);
  }
  .phone-slip .convert-btn { font-size: 10.5px; color: var(--green-dark); border: 1px solid var(--green); border-radius: 3px; padding: 1px 5px; background: #fff; }
  .phone-slip .convert-btn:hover { background: var(--green-light); }

  .chanel-cols { display: flex; flex-direction: column; gap: 10px; }
  .chanel-col h4 {
    font-size: 11px; text-transform: uppercase; color: var(--text-muted); margin: 0 0 6px; letter-spacing: 0.03em;
  }
  .chanel-task {
    border: 1px solid var(--border);
    border-left: 4px solid var(--green);
    border-radius: 5px;
    padding: 6px 8px;
    margin-bottom: 6px;
    background: #fff;
  }
  .chanel-task .t { font-weight: 600; font-size: 12.5px; cursor: pointer; }
  .chanel-task .c { color: var(--text-muted); font-size: 11px; margin-bottom: 4px; }
  .chanel-actions { display: flex; gap: 4px; flex-wrap: wrap; }
  .chanel-actions button {
    font-size: 10.5px; padding: 2px 6px; border-radius: 3px; border: 1px solid var(--border); background: #fff; cursor: pointer;
  }
  .chanel-actions button.active { background: var(--green); color: #fff; border-color: var(--green); }

  /* Centre planner */
  .week-nav {
    display: flex; align-items: center; gap: 10px; margin-bottom: 10px; font-size: 12.5px; color: var(--text-muted);
  }
  .week-nav .week-range { font-weight: 700; color: var(--text); min-width: 160px; text-align: center; }

  .planner-grid {
    display: grid;
    grid-template-columns: 54px repeat(5, 1fr);
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
    background: var(--card);
  }
  .planner-grid .head {
    background: var(--green-light);
    font-weight: 700;
    font-size: 12px;
    text-align: center;
    padding: 8px 4px;
    border-bottom: 1px solid var(--border);
    border-left: 1px solid var(--border);
    color: var(--green-dark);
  }
  .planner-grid .head:first-child { border-left: none; }
  .planner-grid .time-label {
    font-size: 10.5px;
    color: var(--text-muted);
    text-align: right;
    padding: 3px 6px;
    border-top: 1px solid var(--border);
    background: #fafbfa;
  }
  .planner-grid .cell {
    border-top: 1px solid var(--border);
    border-left: 1px solid var(--border);
    min-height: 28px;
    padding: 2px;
  }
  .planner-grid .cell.drag-over { background: var(--green-light); }
  .task-card {
    background: #fff;
    border: 1px solid var(--border);
    border-left: 4px solid var(--green);
    border-radius: 5px;
    padding: 5px 7px;
    cursor: pointer;
    font-size: 12px;
    height: 100%;
  }
  .task-card:hover { box-shadow: 0 1px 4px rgba(0,0,0,0.08); }
  .task-card .title { font-weight: 700; }
  .task-card .client { color: var(--text-muted); font-size: 11px; }
  .task-card .hours { font-size: 10.5px; color: var(--text-muted); margin-top: 2px; }
  .task-card.prio-High { border-left-color: var(--danger); }
  .task-card.prio-Medium { border-left-color: var(--amber); }
  .task-card.prio-Low { border-left-color: #8ea0b3; }
  .task-card.kind-meeting { background: var(--meeting-bg); border-left-color: var(--meeting); }
  .task-card.continuation { padding: 2px; opacity: 0.5; }

  /* Right panel: parking lot */
  .parking-list { display: flex; flex-direction: column; gap: 8px; }
  .parking-card {
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 8px;
    background: #fff;
    cursor: grab;
  }
  .parking-card .title { font-weight: 700; font-size: 13px; cursor: pointer; }
  .parking-card .client { color: var(--text-muted); font-size: 11.5px; margin-bottom: 4px; }
  .parking-card .meta { display: flex; justify-content: space-between; font-size: 11px; color: var(--text-muted); margin-bottom: 6px; }
  .parking-card .actions { display: flex; gap: 6px; }

  /* Sub-tasks / work log */
  .subtask-row { display: flex; align-items: center; gap: 6px; padding: 3px 0; font-size: 12.5px; }
  .subtask-row .txt.done { text-decoration: line-through; color: var(--text-muted); }
  .subtask-row .txt { flex: 1; }
  .subtask-row button { border: none; background: none; cursor: pointer; color: var(--text-muted); font-size: 13px; }
  .subtask-row button:hover { color: var(--danger); }
  .subtask-badge {
    background: #eef1f0; color: var(--text-muted); font-size: 10px; padding: 1px 5px; border-radius: 8px; margin-left: 5px;
  }

  /* Modal */
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(20,30,25,0.5);
    display: flex; align-items: center; justify-content: center; z-index: 200;
  }
  .modal {
    background: #fff; border-radius: 8px; padding: 20px; width: 380px; max-width: calc(100vw - 32px);
    max-height: calc(100vh - 40px); overflow-y: auto;
  }
  .modal.modal-wide { width: 560px; }
  .modal h2 { margin: 0 0 14px; font-size: 16px; }
  .modal h3 { font-size: 12.5px; text-transform: uppercase; letter-spacing: 0.03em; color: var(--green-dark); margin: 0 0 6px; }
  .modal label {
    display: flex; flex-direction: column; gap: 3px; font-size: 12px; color: var(--text-muted);
    margin-bottom: 10px; font-weight: 600;
  }
  .modal input, .modal select {
    font-family: var(--sans); font-size: 13.5px; padding: 7px 9px; border: 1px solid var(--border);
    border-radius: 5px; color: var(--text); font-weight: 400;
  }
  .row2 { display: flex; gap: 10px; }
  .row2 > label { flex: 1; }
  .swatches { display: flex; gap: 6px; flex-wrap: wrap; }
  .swatch {
    width: 22px; height: 22px; border-radius: 50%; cursor: pointer; border: 2px solid transparent;
  }
  .swatch.selected { border-color: var(--text); }
  .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
  .modal-actions.spread { justify-content: space-between; }
  .radio-group { display: flex; gap: 14px; margin-bottom: 10px; }
  .radio-group label { flex-direction: row; align-items: center; gap: 5px; font-weight: 600; color: var(--text); }
  .stat-row { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; border-bottom: 1px solid var(--border); font-size: 13px; gap: 10px; }
  .stat-row b { font-size: 14px; }
  .prompt-text { font-size: 13.5px; margin-bottom: 12px; }
</style>
</head>
<body>

<header class="topbar">
  <h1>SR Planner</h1>
  <div class="actions">
    <span class="date" id="todayLabel"></span>
    <button class="btn btn-light" onclick="openReportModal()">Report</button>
    <button class="btn btn-light" onclick="openAddMeetingModal()">+ Add Meeting</button>
    <button class="btn btn-light" onclick="openAddTaskModal()">+ Add Task</button>
  </div>
</header>

<div class="layout">
  <div class="panel" id="leftPanel"></div>
  <div class="panel" id="centrePanel"></div>
  <div class="panel" id="rightPanel" ondragover="event.preventDefault()" ondrop="handleParkingDrop(event)"></div>
</div>

<div id="modalRoot"></div>

<script>
(function () {
  'use strict';

  var STORAGE_KEY = 'srPlannerState';
  var SWATCHES = ['#1f7a4d', '#3b82f6', '#f59e0b', '#ef4444', '#8b5cf6', '#14b8a6', '#64748b', '#0ea5e9'];
  var MEETING_COLOUR = '#8b5cf6';
  var CHANEL_STATUSES = ['To Do', 'Doing', 'Done'];
  var CHANEL_COLUMN_ORDER = ['Doing', 'To Do', 'Done'];
  var CHANEL_DONE_LIMIT = 3;
  var MEETING_DURATIONS = [
    { label: '30 min', slots: 1 },
    { label: '1 hour', slots: 2 },
    { label: '1.5 hours', slots: 3 },
    { label: '2 hours', slots: 4 },
    { label: '3 hours', slots: 6 }
  ];

  function pad2(n) {
    return n < 10 ? '0' + n : '' + n;
  }

  var TIME_SLOTS = (function () {
    var slots = [];
    var startMin = 6 * 60 + 30; // 06:30
    var endMin = 19 * 60; // up to (not incl) 19:00
    for (var m = startMin; m < endMin; m += 30) {
      slots.push(pad2(Math.floor(m / 60)) + ':' + pad2(m % 60));
    }
    return slots;
  })();

  var weekOffset = 0;
  var pendingSlipConversionId = null;

  /* ---------- state ---------- */

  function defaultState() {
    return { nextId: 1, tasks: [], phoneSlips: [] };
  }

  function loadState() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return defaultState();
      var parsed = JSON.parse(raw);
      if (!parsed || !Array.isArray(parsed.tasks)) return defaultState();
      if (!Array.isArray(parsed.phoneSlips)) parsed.phoneSlips = [];
      if (typeof parsed.nextId !== 'number') parsed.nextId = 1;
      parsed.tasks.forEach(function (t) {
        if (!Array.isArray(t.subtasks)) t.subtasks = [];
        if (!Array.isArray(t.workLog)) t.workLog = [];
        if (!t.kind) t.kind = 'task';
      });
      return parsed;
    } catch (e) {
      console.error('Failed to load saved data, starting fresh.', e);
      return defaultState();
    }
  }

  var state = loadState();

  function saveState() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  }

  function uid() {
    var id = state.nextId;
    state.nextId += 1;
    return id;
  }

  function getTask(id) {
    for (var i = 0; i < state.tasks.length; i++) {
      if (state.tasks[i].id === id) return state.tasks[i];
    }
    return null;
  }

  /* ---------- helpers ---------- */

  function escapeHtml(str) {
    return String(str == null ? '' : str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  function fmtDate(d) {
    if (!d) return '';
    var parts = d.split('-');
    if (parts.length !== 3) return d;
    return parts[2] + '/' + parts[1] + '/' + parts[0];
  }

  function isoDate(d) {
    return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
  }

  function mondayOf(date) {
    var d = new Date(date);
    var day = d.getDay();
    var diff = (day === 0 ? -6 : 1 - day);
    d.setDate(d.getDate() + diff);
    d.setHours(0, 0, 0, 0);
    return d;
  }

  function addDays(date, n) {
    var d = new Date(date);
    d.setDate(d.getDate() + n);
    return d;
  }

  function currentWeekStart() {
    return addDays(mondayOf(new Date()), weekOffset * 7);
  }

  function fmtDayHeader(d) {
    return d.toLocaleDateString(undefined, { weekday: 'short' }) + ' ' + d.getDate() + ' ' + d.toLocaleDateString(undefined, { month: 'short' });
  }

  function fmtWeekRange(start) {
    var end = addDays(start, 4);
    return start.getDate() + ' ' + start.toLocaleDateString(undefined, { month: 'short' }) +
      ' - ' + end.getDate() + ' ' + end.toLocaleDateString(undefined, { month: 'short' }) + ' ' + end.getFullYear();
  }

  function durationLabel(slots) {
    var match = MEETING_DURATIONS.filter(function (d) { return d.slots === slots; })[0];
    return match ? match.label : (slots * 30) + ' min';
  }

  function subtaskBadge(t) {
    if (!t.subtasks || !t.subtasks.length) return '';
    var done = t.subtasks.filter(function (s) { return s.done; }).length;
    return '<span class="subtask-badge">' + done + '/' + t.subtasks.length + '</span>';
  }

  function occupiedSlotsFor(item) {
    if (item.kind === 'meeting') {
      var startIdx = TIME_SLOTS.indexOf(item.startTime);
      if (startIdx === -1) return [item.startTime];
      return TIME_SLOTS.slice(startIdx, startIdx + (item.durationSlots || 1));
    }
    return [item.startTime];
  }

  function findConflict(dateIso, startTime, durationSlots, excludeId) {
    var startIdx = TIME_SLOTS.indexOf(startTime);
    if (startIdx === -1) return null;
    var wanted = TIME_SLOTS.slice(startIdx, startIdx + durationSlots);
    var candidates = state.tasks.filter(function (t) {
      return t.assignedTo === 'Stephan' && !t.completed && t.scheduledDate === dateIso && t.startTime && t.id !== excludeId;
    });
    for (var i = 0; i < candidates.length; i++) {
      var occ = occupiedSlotsFor(candidates[i]);
      for (var j = 0; j < occ.length; j++) {
        if (wanted.indexOf(occ[j]) !== -1) return candidates[i];
      }
    }
    return null;
  }

  /* ---------- modal ---------- */

  function openModal(html, wide) {
    document.getElementById('modalRoot').innerHTML =
      '<div class="modal-overlay" onclick="if(event.target===this) closeModal()">' +
      '<div class="modal' + (wide ? ' modal-wide' : '') + '" onclick="event.stopPropagation()">' + html + '</div></div>';
  }

  function closeModal() {
    pendingSlipConversionId = null;
    document.getElementById('modalRoot').innerHTML = '';
  }

  /* ---------- task CRUD ---------- */

  function createTask(data) {
    var budget = Number(data.budgetHours) || 0;
    var task = {
      id: uid(),
      client: data.client || '',
      title: data.title || '',
      budgetHours: budget,
      actualHours: 0,
      remainingHours: budget,
      dueDate: data.dueDate || '',
      priority: data.priority || 'Medium',
      assignedTo: data.assignedTo || 'Stephan',
      colour: data.colour || SWATCHES[0],
      kind: data.kind || 'task',
      scheduledDate: data.scheduledDate,
      startTime: data.startTime,
      durationSlots: data.durationSlots,
      completed: false,
      completedAt: undefined,
      chanelStatus: data.assignedTo === 'Chanel' ? 'To Do' : undefined,
      subtasks: [],
      workLog: []
    };
    state.tasks.push(task);
    saveState();
    render();
    return task;
  }

  function updateTask(id, patch) {
    var t = getTask(id);
    if (!t) return;
    Object.assign(t, patch);
    saveState();
    render();
  }

  function deleteTaskConfirm(id) {
    var t = getTask(id);
    if (!t) return;
    openModal(
      '<h2>Delete Task</h2>' +
      '<p class="prompt-text">Delete "' + escapeHtml(t.title) + '" for ' + escapeHtml(t.client) + '? This cannot be undone.</p>' +
      '<div class="modal-actions">' +
      '<button class="btn btn-secondary" onclick="closeModal()">Cancel</button>' +
      '<button class="btn btn-danger" onclick="deleteTask(' + id + ')">Delete</button>' +
      '</div>'
    );
  }

  function deleteTask(id) {
    state.tasks = state.tasks.filter(function (t) { return t.id !== id; });
    saveState();
    closeModal();
    render();
  }

  function scheduleTask(id, dateIso, time) {
    var t = getTask(id);
    var durationSlots = (t && t.kind === 'meeting') ? (t.durationSlots || 1) : 1;
    var conflict = findConflict(dateIso, time, durationSlots, id);
    if (conflict && !confirm('This overlaps with "' + conflict.title + '". Schedule anyway?')) return;
    updateTask(id, { scheduledDate: dateIso, startTime: time });
    closeModal();
  }

  function completeTask(id) {
    updateTask(id, { completed: true, completedAt: new Date().toISOString() });
    closeModal();
  }

  function restoreTask(id) {
    updateTask(id, { completed: false, completedAt: undefined });
    reopenReport();
  }

  function setChanelStatus(id, status) {
    var patch = { chanelStatus: status };
    patch.completedAt = status === 'Done' ? new Date().toISOString() : undefined;
    updateTask(id, patch);
  }

  function restoreChanelTask(id) {
    updateTask(id, { chanelStatus: 'To Do', completedAt: undefined });
    reopenReport();
  }

  function reopenReport() {
    var f = document.getElementById('report_from');
    var t = document.getElementById('report_to');
    openReportModal(f ? f.value : '', t ? t.value : '');
  }

  function continueTomorrowChanel(id) {
    var t = getTask(id);
    if (!t) return;
    var dup = {
      id: uid(),
      client: t.client,
      title: t.title,
      budgetHours: 0,
      actualHours: 0,
      remainingHours: 0,
      dueDate: t.dueDate,
      priority: t.priority,
      assignedTo: 'Chanel',
      colour: t.colour,
      kind: 'task',
      scheduledDate: undefined,
      startTime: undefined,
      completed: false,
      completedAt: undefined,
      chanelStatus: 'To Do',
      subtasks: (t.subtasks || []).map(function (s) { return { id: uid(), text: s.text, done: false }; }),
      workLog: []
    };
    state.tasks.unshift(dup);
    t.completed = true;
    saveState();
    closeModal();
    render();
  }

  /* ---------- drag and drop ---------- */

  function handleDragStart(e, id) {
    e.dataTransfer.setData('text/plain', String(id));
    e.dataTransfer.effectAllowed = 'move';
  }

  function handleCellDragOver(e) {
    e.preventDefault();
    e.dataTransfer.dropEffect = 'move';
  }

  function handleCellDrop(e, dateIso, time) {
    e.preventDefault();
    var id = Number(e.dataTransfer.getData('text/plain'));
    if (!id) return;
    scheduleTask(id, dateIso, time);
  }

  function handleParkingDrop(e) {
    e.preventDefault();
    var id = Number(e.dataTransfer.getData('text/plain'));
    if (!id) return;
    updateTask(id, { scheduledDate: undefined, startTime: undefined });
  }

  /* ---------- week navigation ---------- */

  function prevWeek() { weekOffset -= 1; render(); }
  function nextWeek() { weekOffset += 1; render(); }
  function thisWeek() { weekOffset = 0; render(); }

  /* ---------- phone slips ---------- */

  function addPhoneSlip(text) {
    if (!text.trim()) return;
    state.phoneSlips.push({ id: uid(), text: text.trim(), done: false });
    saveState();
    render();
  }

  function togglePhoneSlip(id) {
    state.phoneSlips.forEach(function (p) { if (p.id === id) p.done = !p.done; });
    saveState();
    render();
  }

  function deletePhoneSlip(id) {
    state.phoneSlips = state.phoneSlips.filter(function (p) { return p.id !== id; });
    saveState();
    render();
  }

  function handlePhoneSlipKey(evt) {
    if (evt.key === 'Enter') {
      addPhoneSlip(evt.target.value);
      evt.target.value = '';
    }
  }

  function convertPhoneSlipToTask(id) {
    var slip = state.phoneSlips.filter(function (p) { return p.id === id; })[0];
    if (!slip) return;
    pendingSlipConversionId = id;
    openAddTaskModal({ title: slip.text });
  }

  /* ---------- chanel quick add ---------- */

  function handleChanelQuickAddKey(evt) {
    if (evt.key === 'Enter') {
      var text = evt.target.value.trim();
      if (text) {
        createTask({ title: text, client: '', assignedTo: 'Chanel', priority: 'Medium', colour: SWATCHES[0] });
      }
      evt.target.value = '';
    }
  }

  /* ---------- sub-tasks ---------- */

  function handleSubtaskKey(evt, taskId) {
    if (evt.key === 'Enter') {
      addSubtask(taskId, evt.target.value);
      evt.target.value = '';
    }
  }

  function addSubtask(taskId, text) {
    text = (text || '').trim();
    if (!text) return;
    var t = getTask(taskId);
    if (!t) return;
    if (!t.subtasks) t.subtasks = [];
    t.subtasks.push({ id: uid(), text: text, done: false });
    saveState();
    openTaskDetails(taskId);
    render();
  }

  function toggleSubtask(taskId, subId) {
    var t = getTask(taskId);
    if (!t || !t.subtasks) return;
    var s = t.subtasks.filter(function (x) { return x.id === subId; })[0];
    if (s) s.done = !s.done;
    saveState();
    openTaskDetails(taskId);
    render();
  }

  function deleteSubtask(taskId, subId) {
    var t = getTask(taskId);
    if (!t || !t.subtasks) return;
    t.subtasks = t.subtasks.filter(function (x) { return x.id !== subId; });
    saveState();
    openTaskDetails(taskId);
    render();
  }

  function subtaskListHtml(t) {
    var items = t.subtasks || [];
    var rows = items.map(function (s) {
      return '<div class="subtask-row">' +
        '<input type="checkbox" ' + (s.done ? 'checked' : '') + ' onchange="toggleSubtask(' + t.id + ',' + s.id + ')" />' +
        '<span class="txt' + (s.done ? ' done' : '') + '">' + escapeHtml(s.text) + '</span>' +
        '<button onclick="deleteSubtask(' + t.id + ',' + s.id + ')" title="Delete">&times;</button>' +
        '</div>';
    }).join('') || '<div class="empty-note">No sub-tasks.</div>';

    return '<h3>Sub-tasks</h3>' + rows +
      '<div class="phone-slip-add">' +
      '<input type="text" placeholder="Add sub-task..." onkeydown="handleSubtaskKey(event,' + t.id + ')" />' +
      '</div>';
  }

  /* ---------- work log ---------- */

  function deleteWorkLogEntry(taskId, entryId) {
    var t = getTask(taskId);
    if (!t || !t.workLog) return;
    t.workLog = t.workLog.filter(function (e) { return e.id !== entryId; });
    t.actualHours = t.workLog.reduce(function (s, e) { return s + e.hours; }, 0);
    t.remainingHours = Math.max(0, (t.budgetHours || 0) - t.actualHours);
    saveState();
    openTaskDetails(taskId);
    render();
  }

  function workLogHtml(t) {
    var entries = t.workLog || [];
    if (!entries.length) return '';
    var rows = entries.slice().reverse().map(function (e) {
      return '<div class="subtask-row"><span class="txt">' + new Date(e.timestamp).toLocaleString() + ' &mdash; ' + e.hours + 'h</span>' +
        '<button onclick="deleteWorkLogEntry(' + t.id + ',' + e.id + ')" title="Remove entry">&times;</button></div>';
    }).join('');
    return '<h3>Work Log</h3>' + rows;
  }

  /* ---------- modals: add / edit ---------- */

  function taskFormFields(t) {
    t = t || {};
    var assignedTo = t.assignedTo || 'Stephan';
    var priority = t.priority || 'Medium';
    var colour = t.colour || SWATCHES[0];
    var stephanChecked = assignedTo === 'Stephan' ? 'checked' : '';
    var chanelChecked = assignedTo === 'Chanel' ? 'checked' : '';

    var swatchHtml = SWATCHES.map(function (c) {
      var sel = c === colour ? ' selected' : '';
      return '<div class="swatch' + sel + '" style="background:' + c + '" onclick="selectSwatch(this,\'' + c + '\')"></div>';
    }).join('');

    return (
      '<div class="radio-group">' +
      '<label><input type="radio" name="assignedTo" value="Stephan" ' + stephanChecked + ' onchange="toggleBudgetField(this.value)"> Stephan</label>' +
      '<label><input type="radio" name="assignedTo" value="Chanel" ' + chanelChecked + ' onchange="toggleBudgetField(this.value)"> Chanel</label>' +
      '</div>' +
      '<label>Client<input id="f_client" type="text" value="' + escapeHtml(t.client || '') + '" /></label>' +
      '<label>Title<input id="f_title" type="text" value="' + escapeHtml(t.title || '') + '" /></label>' +
      '<div class="row2">' +
      '<label id="f_budget_wrap" style="display:' + (assignedTo === 'Chanel' ? 'none' : 'flex') + '">Budget Hours<input id="f_budget" type="number" min="0" step="0.25" value="' + (t.budgetHours != null ? t.budgetHours : '') + '" /></label>' +
      '<label>Due Date<input id="f_due" type="date" value="' + (t.dueDate || '') + '" /></label>' +
      '</div>' +
      '<label>Priority<select id="f_priority">' +
      ['High', 'Medium', 'Low'].map(function (p) {
        return '<option value="' + p + '"' + (p === priority ? ' selected' : '') + '>' + p + '</option>';
      }).join('') +
      '</select></label>' +
      '<label>Colour<div class="swatches" id="f_swatches">' + swatchHtml + '</div>' +
      '<input type="hidden" id="f_colour" value="' + colour + '" /></label>'
    );
  }

  function selectSwatch(el, colour) {
    var wrap = document.getElementById('f_swatches');
    Array.prototype.forEach.call(wrap.children, function (c) { c.classList.remove('selected'); });
    el.classList.add('selected');
    document.getElementById('f_colour').value = colour;
  }

  function toggleBudgetField(assignedTo) {
    document.getElementById('f_budget_wrap').style.display = assignedTo === 'Chanel' ? 'none' : 'flex';
  }

  function openAddTaskModal(prefill) {
    openModal(
      '<h2>New Task</h2>' +
      taskFormFields(prefill || {}) +
      '<div class="modal-actions">' +
      '<button class="btn btn-secondary" onclick="closeModal()">Cancel</button>' +
      '<button class="btn btn-primary" onclick="submitAddTask()">Add Task</button>' +
      '</div>'
    );
  }

  function submitAddTask() {
    var assignedTo = document.querySelector('input[name="assignedTo"]:checked').value;
    var title = document.getElementById('f_title').value.trim();
    var client = document.getElementById('f_client').value.trim();
    if (!title || !client) { alert('Client and Title are required.'); return; }
    createTask({
      client: client,
      title: title,
      budgetHours: document.getElementById('f_budget').value,
      dueDate: document.getElementById('f_due').value,
      priority: document.getElementById('f_priority').value,
      assignedTo: assignedTo,
      colour: document.getElementById('f_colour').value
    });
    if (pendingSlipConversionId !== null) {
      var slipId = pendingSlipConversionId;
      pendingSlipConversionId = null;
      deletePhoneSlip(slipId);
    }
    closeModal();
  }

  function openEditTaskModal(id) {
    var t = getTask(id);
    if (!t) return;
    openModal(
      '<h2>Edit Task</h2>' +
      taskFormFields(t) +
      '<div class="modal-actions">' +
      '<button class="btn btn-secondary" onclick="closeModal()">Cancel</button>' +
      '<button class="btn btn-primary" onclick="submitEditTask(' + id + ')">Save</button>' +
      '</div>'
    );
  }

  function submitEditTask(id) {
    var title = document.getElementById('f_title').value.trim();
    var client = document.getElementById('f_client').value.trim();
    if (!title || !client) { alert('Client and Title are required.'); return; }
    var budget = Number(document.getElementById('f_budget').value) || 0;
    var t = getTask(id);
    var patch = {
      client: client,
      title: title,
      dueDate: document.getElementById('f_due').value,
      priority: document.getElementById('f_priority').value,
      colour: document.getElementById('f_colour').value
    };
    if (t.assignedTo === 'Stephan' && t.kind !== 'meeting') {
      patch.budgetHours = budget;
      var worked = t.actualHours || 0;
      patch.remainingHours = Math.max(0, budget - worked);
    }
    updateTask(id, patch);
    closeModal();
  }

  /* ---------- meetings ---------- */

  function openAddMeetingModal() {
    var timeOptions = TIME_SLOTS.map(function (time) {
      return '<option value="' + time + '">' + time + '</option>';
    }).join('');
    var durationOptions = MEETING_DURATIONS.map(function (d) {
      return '<option value="' + d.slots + '"' + (d.slots === 2 ? ' selected' : '') + '>' + d.label + '</option>';
    }).join('');
    openModal(
      '<h2>New Meeting</h2>' +
      '<label>Title<input id="m_title" type="text" placeholder="e.g. Client review" /></label>' +
      '<label>With / Client<input id="m_client" type="text" /></label>' +
      '<div class="row2">' +
      '<label>Date<input id="m_date" type="date" /></label>' +
      '<label>Start Time<select id="m_time">' + timeOptions + '</select></label>' +
      '</div>' +
      '<label>Duration<select id="m_duration">' + durationOptions + '</select></label>' +
      '<p class="prompt-text">A companion to-do to schedule this on Outlook and set alarms will be added to Chanel\'s To Do automatically.</p>' +
      '<div class="modal-actions">' +
      '<button class="btn btn-secondary" onclick="closeModal()">Cancel</button>' +
      '<button class="btn btn-primary" onclick="submitAddMeeting()">Schedule Meeting</button>' +
      '</div>'
    );
  }

  function submitAddMeeting() {
    var title = document.getElementById('m_title').value.trim();
    var client = document.getElementById('m_client').value.trim();
    var date = document.getElementById('m_date').value;
    var time = document.getElementById('m_time').value;
    var durationSlots = Number(document.getElementById('m_duration').value);
    if (!title || !date) { alert('Title and date are required.'); return; }

    var conflict = findConflict(date, time, durationSlots, null);
    if (conflict && !confirm('This overlaps with "' + conflict.title + '". Schedule anyway?')) return;

    createTask({
      title: title,
      client: client,
      assignedTo: 'Stephan',
      priority: 'Medium',
      colour: MEETING_COLOUR,
      kind: 'meeting',
      scheduledDate: date,
      startTime: time,
      durationSlots: durationSlots
    });
    createTask({
      title: 'Schedule "' + title + '" on Outlook + set alarm — ' + fmtDate(date) + ' ' + time,
      client: client,
      assignedTo: 'Chanel',
      priority: 'Medium',
      colour: SWATCHES[0]
    });
    closeModal();
  }

  /* ---------- schedule modal ---------- */

  function openScheduleModal(id) {
    var t = getTask(id);
    if (!t) return;
    var dateVal = t.scheduledDate || '';
    var timeOptions = TIME_SLOTS.map(function (time) {
      var sel = t.startTime === time ? ' selected' : '';
      return '<option value="' + time + '"' + sel + '>' + time + '</option>';
    }).join('');
    var durationField = t.kind === 'meeting'
      ? '<label>Duration<select id="s_duration">' + MEETING_DURATIONS.map(function (d) {
          var sel = (t.durationSlots || 2) === d.slots ? ' selected' : '';
          return '<option value="' + d.slots + '"' + sel + '>' + d.label + '</option>';
        }).join('') + '</select></label>'
      : '';
    openModal(
      '<h2>Schedule ' + (t.kind === 'meeting' ? 'Meeting' : 'Task') + '</h2>' +
      '<p class="prompt-text">' + escapeHtml(t.title) + ' &mdash; ' + escapeHtml(t.client) + '</p>' +
      '<label>Date<input id="s_date" type="date" value="' + dateVal + '" /></label>' +
      '<label>Start Time<select id="s_time">' + timeOptions + '</select></label>' +
      durationField +
      '<div class="modal-actions">' +
      '<button class="btn btn-secondary" onclick="closeModal()">Cancel</button>' +
      '<button class="btn btn-primary" onclick="submitSchedule(' + id + ')">Schedule</button>' +
      '</div>'
    );
  }

  function submitSchedule(id) {
    var date = document.getElementById('s_date').value;
    var time = document.getElementById('s_time').value;
    if (!date) { alert('Please choose a date.'); return; }
    var t = getTask(id);
    if (t && t.kind === 'meeting') {
      var durationSlots = Number(document.getElementById('s_duration').value);
      var conflict = findConflict(date, time, durationSlots, id);
      if (conflict && !confirm('This overlaps with "' + conflict.title + '". Schedule anyway?')) return;
      updateTask(id, { scheduledDate: date, startTime: time, durationSlots: durationSlots });
      closeModal();
      return;
    }
    scheduleTask(id, date, time);
  }

  /* ---------- log work modal ---------- */

  function openLogWorkModal(id) {
    var t = getTask(id);
    if (!t) return;
    openModal(
      '<h2>Log Work</h2>' +
      '<p class="prompt-text">' + escapeHtml(t.title) + ' &mdash; ' + escapeHtml(t.client) + '</p>' +
      '<div class="stat-row"><span>Budget</span><b>' + t.budgetHours + 'h</b></div>' +
      '<div class="stat-row"><span>Actual (so far)</span><b>' + t.actualHours + 'h</b></div>' +
      '<div class="stat-row"><span>Remaining</span><b>' + t.remainingHours + 'h</b></div>' +
      '<label style="margin-top:10px;">Hours worked now<input id="lw_hours" type="number" min="0" step="0.25" value="" autofocus /></label>' +
      '<p class="prompt-text">Each entry is timestamped, so you can log work more than once a day.</p>' +
      '<div class="modal-actions">' +
      '<button class="btn btn-secondary" onclick="closeModal()">Cancel</button>' +
      '<button class="btn btn-primary" onclick="calcLogWork(' + id + ')">Save Work</button>' +
      '</div>'
    );
  }

  function calcLogWork(id) {
    var t = getTask(id);
    if (!t) return;
    var worked = Number(document.getElementById('lw_hours').value) || 0;
    if (worked <= 0) { alert('Enter the hours worked.'); return; }

    if (!t.workLog) t.workLog = [];
    t.workLog.push({ id: uid(), timestamp: new Date().toISOString(), hours: worked });
    t.actualHours = t.workLog.reduce(function (s, e) { return s + e.hours; }, 0);
    t.remainingHours = Math.max(0, (t.budgetHours || 0) - t.actualHours);
    saveState();
    render();

    if (t.remainingHours <= 0) {
      completeTask(id);
      return;
    }

    openModal(
      '<h2>Continue Tomorrow?</h2>' +
      '<div class="stat-row"><span>Budget</span><b>' + t.budgetHours + 'h</b></div>' +
      '<div class="stat-row"><span>Actual</span><b>' + t.actualHours + 'h</b></div>' +
      '<div class="stat-row"><span>Remaining</span><b>' + t.remainingHours + 'h</b></div>' +
      '<p class="prompt-text" style="margin-top:10px;">Send this task back to the Parking Lot to continue tomorrow, or mark it complete now.</p>' +
      '<div class="modal-actions spread">' +
      '<button class="btn btn-danger" onclick="finishLogWork(' + id + ', false)">Mark Complete</button>' +
      '<button class="btn btn-primary" onclick="finishLogWork(' + id + ', true)">Continue Tomorrow</button>' +
      '</div>'
    );
  }

  function finishLogWork(id, continueTomorrow) {
    if (continueTomorrow) {
      updateTask(id, { scheduledDate: undefined, startTime: undefined });
      closeModal();
    } else {
      completeTask(id);
    }
  }

  /* ---------- report / archive ---------- */

  function downloadCsv(rows, filename) {
    var csv = rows.map(function (row) {
      return row.map(function (cell) {
        var s = String(cell == null ? '' : cell);
        if (s.indexOf(',') !== -1 || s.indexOf('"') !== -1 || s.indexOf('\n') !== -1) {
          s = '"' + s.replace(/"/g, '""') + '"';
        }
        return s;
      }).join(',');
    }).join('\r\n');
    var blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  function billableCompleted(fromDate, toDate) {
    return state.tasks.filter(function (t) {
      if (t.assignedTo !== 'Stephan' || t.kind === 'meeting' || !t.completed || !t.completedAt) return false;
      var d = t.completedAt.slice(0, 10);
      if (fromDate && d < fromDate) return false;
      if (toDate && d > toDate) return false;
      return true;
    }).sort(function (a, b) { return a.completedAt < b.completedAt ? 1 : -1; });
  }

  function openReportModal(fromDate, toDate) {
    fromDate = fromDate || '';
    toDate = toDate || '';
    var filtered = billableCompleted(fromDate, toDate);
    var totalHours = filtered.reduce(function (sum, t) { return sum + (t.actualHours || 0); }, 0);

    var rowsHtml = filtered.length ? filtered.map(function (t) {
      return '<div class="stat-row"><span>' + escapeHtml(t.client) + ' &mdash; ' + escapeHtml(t.title) +
        '<br><span style="font-size:11px;color:var(--text-muted);font-weight:400;">' + new Date(t.completedAt).toLocaleString() + '</span></span>' +
        '<b>' + t.actualHours + 'h</b>' +
        '<button class="btn btn-secondary btn-sm" onclick="restoreTask(' + t.id + ')">Restore</button></div>';
    }).join('') : '<div class="empty-note">No completed tasks in range.</div>';

    var chanelDone = state.tasks.filter(function (t) { return t.assignedTo === 'Chanel' && t.chanelStatus === 'Done'; })
      .sort(function (a, b) { return (b.completedAt || '') < (a.completedAt || '') ? -1 : 1; });
    var chanelHtml = chanelDone.length ? chanelDone.map(function (t) {
      return '<div class="stat-row"><span>' + escapeHtml(t.title) + (t.client ? (' &mdash; ' + escapeHtml(t.client)) : '') +
        '<br><span style="font-size:11px;color:var(--text-muted);font-weight:400;">' + (t.completedAt ? new Date(t.completedAt).toLocaleString() : '') + '</span></span>' +
        '<button class="btn btn-secondary btn-sm" onclick="restoreChanelTask(' + t.id + ')">Restore</button></div>';
    }).join('') : '<div class="empty-note">No completed Chanel items yet.</div>';

    openModal(
      '<h2>Completed Items &amp; Billing Report</h2>' +
      '<h3>Stephan &mdash; Billing Report</h3>' +
      '<div class="row2">' +
      '<label>From<input type="date" id="report_from" value="' + fromDate + '" /></label>' +
      '<label>To<input type="date" id="report_to" value="' + toDate + '" /></label>' +
      '</div>' +
      '<div class="modal-actions" style="justify-content:flex-start;margin-top:0;">' +
      '<button class="btn btn-secondary btn-sm" onclick="applyReportFilter()">Apply</button>' +
      '<button class="btn btn-primary btn-sm" onclick="downloadReportCsv()">Download CSV</button>' +
      '</div>' +
      '<div class="stat-row"><span><b>Total billable hours</b></span><b>' + totalHours + 'h</b></div>' +
      rowsHtml +
      '<h3 style="margin-top:16px;">Chanel &mdash; Done Archive (all-time)</h3>' +
      chanelHtml +
      '<div class="modal-actions"><button class="btn btn-secondary" onclick="closeModal()">Close</button></div>',
      true
    );
  }

  function applyReportFilter() {
    var f = document.getElementById('report_from').value;
    var t = document.getElementById('report_to').value;
    openReportModal(f, t);
  }

  function downloadReportCsv() {
    var f = document.getElementById('report_from').value;
    var t = document.getElementById('report_to').value;
    var filtered = billableCompleted(f, t);
    var rows = [['Client', 'Task', 'Budget Hours', 'Actual Hours', 'Due Date', 'Completed At']];
    filtered.forEach(function (task) {
      rows.push([task.client, task.title, task.budgetHours, task.actualHours, task.dueDate || '', task.completedAt]);
    });
    downloadCsv(rows, 'sr-planner-billing-report.csv');
  }

  /* ---------- task details ---------- */

  function openTaskDetails(id) {
    var t = getTask(id);
    if (!t) return;
    var isStephan = t.assignedTo === 'Stephan';
    var isMeeting = t.kind === 'meeting';
    var scheduleInfo = t.scheduledDate
      ? (fmtDate(t.scheduledDate) + ' ' + (t.startTime || '') + (isMeeting ? ' (' + durationLabel(t.durationSlots || 1) + ')' : ''))
      : 'Not scheduled';

    var body =
      '<div class="stat-row"><span>Client</span><b>' + escapeHtml(t.client || '&mdash;') + '</b></div>' +
      '<div class="stat-row"><span>Priority</span><b>' + t.priority + '</b></div>' +
      '<div class="stat-row"><span>Due</span><b>' + (fmtDate(t.dueDate) || '&mdash;') + '</b></div>';

    if (isStephan && !isMeeting) {
      body +=
        '<div class="stat-row"><span>Budget</span><b>' + t.budgetHours + 'h</b></div>' +
        '<div class="stat-row"><span>Actual</span><b>' + t.actualHours + 'h</b></div>' +
        '<div class="stat-row"><span>Remaining</span><b>' + t.remainingHours + 'h</b></div>';
    }
    if (isStephan) {
      body += '<div class="stat-row"><span>Schedule</span><b>' + scheduleInfo + '</b></div>';
    }

    var extra = '';
    if (isStephan && !isMeeting) {
      extra += workLogHtml(t);
    }
    extra += subtaskListHtml(t);

    var actions = '<div class="modal-actions" style="flex-wrap:wrap;">';
    if (isStephan) {
      actions += '<button class="btn btn-light btn-sm" onclick="openScheduleModal(' + id + ')">' + (t.scheduledDate ? 'Reschedule' : 'Schedule') + '</button>';
      if (!isMeeting) {
        actions += '<button class="btn btn-light btn-sm" onclick="openLogWorkModal(' + id + ')">Log Work</button>';
      }
    } else if (t.chanelStatus !== 'Done') {
      actions += '<button class="btn btn-light btn-sm" onclick="continueTomorrowChanel(' + id + ')">Continue Tomorrow</button>';
    }
    actions += '<button class="btn btn-secondary btn-sm" onclick="openEditTaskModal(' + id + ')">Edit</button>';
    actions += '<button class="btn btn-primary btn-sm" onclick="completeTask(' + id + ')">Complete</button>';
    actions += '<button class="btn btn-danger btn-sm" onclick="deleteTaskConfirm(' + id + ')">Delete</button>';
    actions += '</div>';

    openModal(
      '<h2>' + escapeHtml(t.title) + '</h2>' + body + extra + actions +
      '<div class="modal-actions"><button class="btn btn-secondary" onclick="closeModal()">Close</button></div>'
    );
  }

  /* ---------- render ---------- */

  function render() {
    document.getElementById('todayLabel').textContent = new Date().toLocaleDateString(undefined, {
      weekday: 'long', year: 'numeric', month: 'long', day: 'numeric'
    });
    renderLeft();
    renderCentre();
    renderRight();
  }

  function renderLeft() {
    var stephanTasks = state.tasks.filter(function (t) { return t.assignedTo === 'Stephan' && !t.completed; });
    var topPriorities = stephanTasks.filter(function (t) { return t.priority === 'High'; });

    var topHtml = topPriorities.length
      ? '<div class="mini-list">' + topPriorities.map(function (t) {
          return '<div class="mini-task" style="border-left-color:' + t.colour + '" onclick="openTaskDetails(' + t.id + ')">' +
            '<div class="t">' + escapeHtml(t.title) + subtaskBadge(t) + '</div>' +
            '<div class="c">' + escapeHtml(t.client) + '</div></div>';
        }).join('') + '</div>'
      : '<div class="empty-note">No high priority tasks.</div>';

    var slipsHtml = state.phoneSlips.map(function (p) {
      return '<div class="phone-slip' + (p.done ? ' done' : '') + '">' +
        '<input type="checkbox" ' + (p.done ? 'checked' : '') + ' onchange="togglePhoneSlip(' + p.id + ')" />' +
        '<span class="txt">' + escapeHtml(p.text) + '</span>' +
        '<button class="convert-btn" onclick="convertPhoneSlipToTask(' + p.id + ')" title="Convert to task">&rarr; Task</button>' +
        '<button onclick="deletePhoneSlip(' + p.id + ')" title="Delete">&times;</button>' +
        '</div>';
    }).join('') || '<div class="empty-note">No phone slips.</div>';

    var chanelTasks = state.tasks.filter(function (t) { return t.assignedTo === 'Chanel' && !t.completed; });
    var chanelHtml = '<div class="chanel-cols">' + CHANEL_COLUMN_ORDER.map(function (status) {
      var items = chanelTasks.filter(function (t) { return (t.chanelStatus || 'To Do') === status; });
      var doneLink = '';
      if (status === 'Done') {
        var totalDone = items.length;
        items = items.slice().sort(function (a, b) { return (b.completedAt || '') < (a.completedAt || '') ? -1 : 1; }).slice(0, CHANEL_DONE_LIMIT);
        if (totalDone > CHANEL_DONE_LIMIT) {
          doneLink = '<div class="link-note" onclick="openReportModal()">View all ' + totalDone + ' done items &rarr;</div>';
        }
      }
      var cardsHtml = items.length
        ? items.map(function (t) {
            return '<div class="chanel-task" style="border-left-color:' + t.colour + '">' +
              '<div class="t" onclick="openTaskDetails(' + t.id + ')">' + escapeHtml(t.title) + subtaskBadge(t) + '</div>' +
              (t.client ? '<div class="c">' + escapeHtml(t.client) + '</div>' : '') +
              '<div class="chanel-actions">' +
              CHANEL_STATUSES.map(function (s) {
                return '<button class="' + (s === status ? 'active' : '') + '" onclick="setChanelStatus(' + t.id + ', \'' + s + '\')">' + s + '</button>';
              }).join('') +
              (status !== 'Done' ? '<button onclick="continueTomorrowChanel(' + t.id + ')">Continue Tmrw</button>' : '') +
              '<button onclick="deleteTaskConfirm(' + t.id + ')">Del</button>' +
              '</div></div>';
          }).join('')
        : '<div class="empty-note">Empty</div>';
      var quickAdd = status === 'To Do'
        ? '<div class="phone-slip-add" style="margin-bottom:6px;"><input type="text" placeholder="Quick add to-do..." onkeydown="handleChanelQuickAddKey(event)" /></div>'
        : '';
      return '<div class="chanel-col"><h4>' + status + '</h4>' + quickAdd + cardsHtml + doneLink + '</div>';
    }).join('') + '</div>';

    document.getElementById('leftPanel').innerHTML =
      '<div class="person-block">' +
      '<div class="person-name">Stephan</div>' +
      '<h3>Top Priorities</h3>' + topHtml +
      '<h3>Phone Slips</h3>' + slipsHtml +
      '<div class="phone-slip-add">' +
      '<input type="text" placeholder="New phone slip..." onkeydown="handlePhoneSlipKey(event)" />' +
      '</div>' +
      '</div>' +
      '<hr class="divider" />' +
      '<div class="person-block">' +
      '<div class="person-name">Chanel</div>' +
      chanelHtml +
      '</div>';
  }

  function renderCentre() {
    var weekStart = currentWeekStart();
    var dayDates = [0, 1, 2, 3, 4].map(function (i) { return addDays(weekStart, i); });
    var dayIsos = dayDates.map(isoDate);

    var scheduledItems = state.tasks.filter(function (t) {
      return t.assignedTo === 'Stephan' && !t.completed && t.scheduledDate && t.startTime;
    });

    function findCell(dateIso, time) {
      for (var i = 0; i < scheduledItems.length; i++) {
        var it = scheduledItems[i];
        if (it.scheduledDate !== dateIso) continue;
        var occ = occupiedSlotsFor(it);
        if (occ.indexOf(time) !== -1) {
          return { item: it, isStart: time === it.startTime };
        }
      }
      return null;
    }

    var headHtml = '<div class="head"></div>' + dayDates.map(function (d) {
      return '<div class="head">' + fmtDayHeader(d) + '</div>';
    }).join('');

    var rowsHtml = TIME_SLOTS.map(function (time) {
      var rowCells = dayIsos.map(function (dateIso) {
        var found = findCell(dateIso, time);
        var inner = '';
        if (found) {
          var it = found.item;
          var kindClass = it.kind === 'meeting' ? ' kind-meeting' : '';
          if (found.isStart) {
            inner = '<div class="task-card prio-' + it.priority + kindClass + '" style="border-left-color:' + it.colour + '" draggable="true" ondragstart="handleDragStart(event,' + it.id + ')" onclick="openTaskDetails(' + it.id + ')">' +
              '<div class="title">' + escapeHtml(it.title) + subtaskBadge(it) + '</div>' +
              '<div class="client">' + escapeHtml(it.client) + '</div>' +
              (it.kind === 'meeting' ? '<div class="hours">Meeting</div>' : '<div class="hours">' + it.remainingHours + 'h left</div>') +
              '</div>';
          } else {
            inner = '<div class="task-card' + kindClass + ' continuation" style="border-left-color:' + it.colour + '" onclick="openTaskDetails(' + it.id + ')"></div>';
          }
        }
        return '<div class="cell" ondragover="handleCellDragOver(event)" ondrop="handleCellDrop(event,\'' + dateIso + '\',\'' + time + '\')">' + inner + '</div>';
      }).join('');
      return '<div class="time-label">' + time + '</div>' + rowCells;
    }).join('');

    var navHtml = '<div class="week-nav">' +
      '<button class="btn btn-secondary btn-sm" onclick="prevWeek()">&lsaquo; Prev</button>' +
      '<span class="week-range">' + fmtWeekRange(weekStart) + (weekOffset === 0 ? ' (This Week)' : '') + '</span>' +
      '<button class="btn btn-secondary btn-sm" onclick="nextWeek()">Next &rsaquo;</button>' +
      (weekOffset !== 0 ? '<button class="btn btn-light btn-sm" onclick="thisWeek()">Today</button>' : '') +
      '</div>';

    document.getElementById('centrePanel').innerHTML =
      '<h2>Weekly Planner</h2>' + navHtml +
      '<div class="planner-grid">' + headHtml + rowsHtml + '</div>';
  }

  function renderRight() {
    var parking = state.tasks.filter(function (t) {
      return t.assignedTo === 'Stephan' && !t.completed && !t.scheduledDate;
    }).sort(function (a, b) {
      if (a.dueDate && b.dueDate) return a.dueDate < b.dueDate ? -1 : (a.dueDate > b.dueDate ? 1 : 0);
      if (a.dueDate) return -1;
      if (b.dueDate) return 1;
      return a.id - b.id;
    });

    var html = parking.length
      ? '<div class="parking-list">' + parking.map(function (t) {
          return '<div class="parking-card" draggable="true" ondragstart="handleDragStart(event,' + t.id + ')" style="border-left:4px solid ' + t.colour + '">' +
            '<div class="title" onclick="openTaskDetails(' + t.id + ')">' + escapeHtml(t.title) + subtaskBadge(t) + '</div>' +
            '<div class="client">' + escapeHtml(t.client) + '</div>' +
            '<div class="meta"><span>' + t.priority + '</span><span>' + t.remainingHours + 'h left</span></div>' +
            (t.dueDate ? '<div class="meta"><span>Due ' + fmtDate(t.dueDate) + '</span><span></span></div>' : '') +
            '<div class="actions">' +
            '<button class="btn btn-primary btn-sm" onclick="openScheduleModal(' + t.id + ')">Schedule</button>' +
            '<button class="btn btn-secondary btn-sm" onclick="openEditTaskModal(' + t.id + ')">Edit</button>' +
            '<button class="btn btn-danger btn-sm" onclick="deleteTaskConfirm(' + t.id + ')">Delete</button>' +
            '</div></div>';
        }).join('') + '</div>'
      : '<div class="empty-note">Parking Lot is empty. Drag a task here, or add a new one.</div>';

    document.getElementById('rightPanel').innerHTML = '<h2>Parking Lot</h2>' + html;
  }

  /* ---------- expose to global for inline handlers ---------- */

  window.openAddTaskModal = openAddTaskModal;
  window.submitAddTask = submitAddTask;
  window.openEditTaskModal = openEditTaskModal;
  window.submitEditTask = submitEditTask;
  window.openAddMeetingModal = openAddMeetingModal;
  window.submitAddMeeting = submitAddMeeting;
  window.openScheduleModal = openScheduleModal;
  window.submitSchedule = submitSchedule;
  window.openLogWorkModal = openLogWorkModal;
  window.calcLogWork = calcLogWork;
  window.finishLogWork = finishLogWork;
  window.openTaskDetails = openTaskDetails;
  window.completeTask = completeTask;
  window.restoreTask = restoreTask;
  window.restoreChanelTask = restoreChanelTask;
  window.deleteTaskConfirm = deleteTaskConfirm;
  window.deleteTask = deleteTask;
  window.closeModal = closeModal;
  window.selectSwatch = selectSwatch;
  window.toggleBudgetField = toggleBudgetField;
  window.addPhoneSlip = addPhoneSlip;
  window.togglePhoneSlip = togglePhoneSlip;
  window.deletePhoneSlip = deletePhoneSlip;
  window.handlePhoneSlipKey = handlePhoneSlipKey;
  window.convertPhoneSlipToTask = convertPhoneSlipToTask;
  window.setChanelStatus = setChanelStatus;
  window.continueTomorrowChanel = continueTomorrowChanel;
  window.handleChanelQuickAddKey = handleChanelQuickAddKey;
  window.handleDragStart = handleDragStart;
  window.handleCellDragOver = handleCellDragOver;
  window.handleCellDrop = handleCellDrop;
  window.handleParkingDrop = handleParkingDrop;
  window.prevWeek = prevWeek;
  window.nextWeek = nextWeek;
  window.thisWeek = thisWeek;
  window.handleSubtaskKey = handleSubtaskKey;
  window.addSubtask = addSubtask;
  window.toggleSubtask = toggleSubtask;
  window.deleteSubtask = deleteSubtask;
  window.deleteWorkLogEntry = deleteWorkLogEntry;
  window.openReportModal = openReportModal;
  window.applyReportFilter = applyReportFilter;
  window.downloadReportCsv = downloadReportCsv;

  render();
})();
</script>
</body>
</html>
